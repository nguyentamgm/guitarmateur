name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Sessions merge their own PRs; a PR stacked on another branch gets merged there and never
      # reaches main (lost #120). Every PR must target main.
      - if: github.event_name == 'pull_request' && github.base_ref != 'main'
        run: |
          echo "::error::PRs must target main (this one targets '${{ github.base_ref }}'). Retarget it: gh pr edit --base main"
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
